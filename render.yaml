services:
  - type: web
    name: boss-club
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: TRUST_PROXY
        value: "1"
      - key: STOP_WINDOW_MS
        value: "6000"
      - key: MAX_ROOMS
        value: "200"
      - key: ROOM_CREATE_LIMIT
        value: "5"
